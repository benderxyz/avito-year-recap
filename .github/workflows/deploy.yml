name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.services }}
      has_changes: ${{ steps.services.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            cards:
              - 'cards-service/**'
            user:
              - 'user-service/**'
            analytics:
              - 'analytics-service/**'
            docs:
              - 'recap-engine/docs/**'
              - 'recap-engine/package.json'
              - 'recap-engine/pnpm-lock.yaml'
              - 'recap-engine/pnpm-workspace.yaml'
            nginx:
              - 'infra/nginx/**'
              - 'analytics.admin/**'
            compose:
              - 'docker-compose.prod.yml'
              - '.env.prod.example'
              - 'scripts/deploy.sh'
              - '.github/workflows/deploy.yml'

      - name: Build deploy service list
        id: services
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          if [[ "$CHANGES" == "[]" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "services=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$CHANGES" | jq -e 'index("compose")' >/dev/null; then
            SERVICES="nginx frontend docs cards user analytics"
          else
            SERVICES=$(echo "$CHANGES" | jq -r 'join(" ")')
            if echo "$CHANGES" | jq -e 'index("analytics")' >/dev/null && ! echo "$CHANGES" | jq -e 'index("cards")' >/dev/null; then
              SERVICES="$SERVICES cards"
            fi
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to VPS
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          envs: SERVICES,GH_DEPLOY_TOKEN
          script: |
            cd ~/avito-year-recap
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh "$SERVICES"
