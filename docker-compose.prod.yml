x-clickhouse-client-env: &clickhouse-client-env
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_DATABASE: default

x-postgres-client-env: &postgres-client-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-recap}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_SSLMODE: disable

x-cors-env: &cors-env
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recap}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  analytics:
    build:
      context: ./analytics-service
    container_name: analytics-service
    environment:
      <<: *clickhouse-client-env
      SERVER_PORT: "8080"
      MIGRATIONS_DIR: /app/migrations
      USER_SERVICE_URL: http://user:8082
    depends_on:
      clickhouse:
        condition: service_started
      user:
        condition: service_healthy
    restart: unless-stopped

  cards:
    build:
      context: ./cards-service
    container_name: cards-service
    environment:
      <<: [*postgres-client-env, *cors-env]
      PORT: "8081"
      USER_SERVICE_URL: http://user:8082
      ANALYTICS_SERVICE_URL: http://analytics:8080
      POSTGRES_DATABASE: cards
      MIGRATIONS_DIR: /app/migrations
      SEEDS_DIR: /app/seeds
      SEED_ON_START: ${SEED_ON_START:-true}
      SHARE_SIGNING_KEY: ${SHARE_SIGNING_KEY}
      SHARE_BASE_URL: ${SHARE_BASE_URL:-https://recaps.hakolr.dev}
      PRODUCT_BASE_URL: ${PRODUCT_BASE_URL:-https://www.avito.ru}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-google/gemma-2-9b-it:free}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      analytics:
        condition: service_started
      user:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  user:
    build:
      context: ./user-service
    container_name: user-service
    environment:
      <<: [*postgres-client-env, *cors-env]
      POSTGRES_DATABASE: users
      SERVER_PORT: "8082"
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_CARDS_BASE_URL: ${VITE_CARDS_BASE_URL}
        VITE_USERS_BASE_URL: ${VITE_USERS_BASE_URL}
        VITE_RECAP_YEAR: ${VITE_RECAP_YEAR:-2026}
    container_name: frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

  docs:
    build:
      context: ./recap-engine
      dockerfile: docs/Dockerfile
      args:
        DOCS_URL: ${DOCS_URL:-https://recaps.hakolr.dev}
        DOCS_BASE_URL: ${DOCS_BASE_URL:-/docs/}
    container_name: recap-docs
    ports:
      - "3001:80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/recap.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_started
      cards:
        condition: service_started
      user:
        condition: service_started
      docs:
        condition: service_started
    restart: unless-stopped

volumes:
  clickhouse-data:
  postgres-data:
