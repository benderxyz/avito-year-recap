x-clickhouse-client-env: &clickhouse-client-env
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: recap
  CLICKHOUSE_DATABASE: default

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: recap
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  analytics:
    build:
      context: ./analytics-service
    container_name: analytics-service
    ports:
      - "8080:8080"
    environment:
      <<: *clickhouse-client-env
      SERVER_PORT: "8080"
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      - clickhouse

  cards:
    build:
      context: ./cards-service
    container_name: cards-service
    ports:
      - "8081:8081"
    environment:
      USER_SERVICE_URL: http://user:8082
      ANALYTICS_SERVICE_URL: http://analytics:8080
      POSTGRES_HOST: cards-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: recap
      POSTGRES_PASSWORD: recap
      POSTGRES_DATABASE: cards
      POSTGRES_SSLMODE: disable
      MIGRATIONS_DIR: /app/migrations
      SEEDS_DIR: /app/seeds
      SEED_ON_START: "true"
    depends_on:
      - analytics
      - user
      - cards-postgres

  cards-postgres:
    image: postgres:16
    container_name: cards-postgres
    environment:
      POSTGRES_USER: recap
      POSTGRES_PASSWORD: recap
      POSTGRES_DB: cards
    volumes:
      - cards-postgres-data:/var/lib/postgresql/data

  user:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      POSTGRES_HOST: user-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: recap
      POSTGRES_PASSWORD: recap
      POSTGRES_DATABASE: users
      POSTGRES_SSLMODE: disable
      SERVER_PORT: "8082"
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      - user-postgres

  user-postgres:
    image: postgres:16
    container_name: user-postgres
    environment:
      POSTGRES_USER: recap
      POSTGRES_PASSWORD: recap
      POSTGRES_DB: users
    volumes:
      - user-postgres-data:/var/lib/postgresql/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: frontend

    ports:
      - "3000:3000"

volumes:
  clickhouse-data:
  cards-postgres-data:
  user-postgres-data:
