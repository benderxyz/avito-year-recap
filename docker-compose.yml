x-clickhouse-client-env: &clickhouse-client-env
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: recap
  CLICKHOUSE_DATABASE: default

x-postgres-client-env: &postgres-client-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: recap
  POSTGRES_PASSWORD: recap
  POSTGRES_SSLMODE: disable

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: recap
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: recap
      POSTGRES_PASSWORD: recap
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recap"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  analytics:
    build:
      context: ./analytics-service
    container_name: analytics-service
    ports:
      - "8080:8080"
    environment:
      <<: *clickhouse-client-env
      SERVER_PORT: "8080"
      MIGRATIONS_DIR: /app/migrations
      USER_SERVICE_URL: http://user:8082
    depends_on:
      clickhouse:
        condition: service_started
      user:
        condition: service_healthy

  cards:
    build:
      context: ./cards-service
    container_name: cards-service
    ports:
      - "8081:8081"
    environment:
      <<: *postgres-client-env
      PORT: "8081"
      USER_SERVICE_URL: http://user:8082
      ANALYTICS_SERVICE_URL: http://analytics:8080
      POSTGRES_DATABASE: cards
      MIGRATIONS_DIR: /app/migrations
      SEEDS_DIR: /app/seeds
      SEED_ON_START: "true"
      LLM_ENABLED: "true"
      LLM_PROVIDER: "openai"
      LLM_BASE_URL: "https://openrouter.ai/api/v1"
      LLM_MODEL: "google/gemma-2-9b-it:free"
      LLM_TIMEOUT_MS: "30000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      analytics:
        condition: service_started
      user:
        condition: service_healthy
      postgres:
        condition: service_healthy

  user:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      <<: *postgres-client-env
      POSTGRES_DATABASE: users
      SERVER_PORT: "8082"
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: frontend

    ports:
      - "3000:3000"

volumes:
  clickhouse-data:
  postgres-data:
