resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name recaps.hakolr.dev;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name recaps.hakolr.dev;

  ssl_certificate /etc/letsencrypt/live/recaps.hakolr.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/recaps.hakolr.dev/privkey.pem;

  client_max_body_size 10m;

  location /api/recap/ {
    set $cards_upstream cards:8081;
    rewrite ^/api/recap/(.*)$ /api/recap/$1 break;
    proxy_pass http://$cards_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/share/ {
    set $cards_upstream cards:8081;
    rewrite ^/api/share/(.*)$ /api/share/$1 break;
    proxy_pass http://$cards_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/admin/ {
    set $cards_upstream cards:8081;
    rewrite ^/api/admin/(.*)$ /api/admin/$1 break;
    proxy_pass http://$cards_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/users {
    set $user_upstream user:8082;
    rewrite ^/api/users(.*)$ /users$1 break;
    proxy_pass http://$user_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /docs {
    return 301 https://$host/docs/;
  }

  location /docs/ {
    set $docs_upstream docs:80;
    rewrite ^/docs/(.*)$ /$1 break;
    proxy_pass http://$docs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $frontend_upstream frontend:3000;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
