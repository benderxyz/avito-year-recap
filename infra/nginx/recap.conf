resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name recaps.hakolr.dev;

  client_max_body_size 10m;

  location /api/cards/ {
    set $cards_upstream cards:8081;
    proxy_pass http://$cards_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/users {
    set $user_upstream user:8082;
    rewrite ^/api/users(.*)$ /users$1 break;
    proxy_pass http://$user_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $frontend_upstream frontend:3000;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name recaps.hakolr.dev;

  ssl_certificate /etc/letsencrypt/live/recaps.hakolr.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/recaps.hakolr.dev/privkey.pem;
}
